name: Build documentation

# FORK (zi-mozhuang/tokenizers): 自动触发已停用。fork 没有 HF_DOC_BUILD_PUSH secret，
# doc-builder 的 "Sync to bucket" 步骤必然失败；本 fork 也不向 HF 空间同步文档。只保留手动触发。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (defaults to the workflow commit)"
        required: false
        default: ""
  # push:
  #   branches:
  #     - main
  #     - doc-builder*
  #     - v*-release
  #     - use_templates
  #   tags:
  #     - v*
  # release:
  #   types: [published]

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169  # main
    with:
      commit_sha: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      package: tokenizers
      path_to_docs: tokenizers/docs/source-doc-builder/
      package_path: tokenizers/bindings/python/
      version_tag_suffix: bindings/python/py_src/
      install_rust: true
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
