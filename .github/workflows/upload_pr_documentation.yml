name: Upload PR Documentation

# FORK (zi-mozhuang/tokenizers): 自动触发已停用。上游靠 workflow_run 跟着
# "Build PR Documentation" 跑；本 fork 没有 HF_DOC_BUILD_PUSH / COMMENT_BOT_TOKEN secret。
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["Build PR Documentation"]
  #   types:
  #     - completed

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169  # main
    with:
      package_name: tokenizers
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}